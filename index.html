<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liked &amp; Kindred</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Themes ────────────────────────────────────────────────────────────────── */
:root {
  --bg:          #f4f4f5;
  --surface:     #ffffff;
  --surface2:    #f0f0f1;
  --border:      #e4e4e7;
  --text:        #18181b;
  --text2:       #71717a;
  --accent:      #1db954;
  --accent-h:    #17a349;
  --danger:      #dc2626;
  --radius:      8px;
  --shadow:      0 1px 4px rgba(0,0,0,.08);
  --font:        -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
[data-theme="dark"] {
  --bg:       #09090b;
  --surface:  #18181b;
  --surface2: #27272a;
  --border:   #3f3f46;
  --text:     #fafafa;
  --text2:    #a1a1aa;
}

/* ── Base ──────────────────────────────────────────────────────────────────── */
html, body { height: 100%; }
body {
  font-family: var(--font);
  background:  var(--bg);
  color:       var(--text);
  font-size:   14px;
  line-height: 1.55;
  transition:  background .2s, color .2s;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code {
  font-size: 12px;
  background: var(--surface2);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
  word-break: break-all;
}

/* ── Buttons ───────────────────────────────────────────────────────────────── */
button {
  font-family: var(--font);
  font-size:   14px;
  cursor:      pointer;
  border:      none;
  border-radius: var(--radius);
  padding:     9px 18px;
  transition:  background .14s, opacity .14s;
  line-height: 1.4;
}
button:disabled { opacity: .45; cursor: not-allowed; }

.btn-primary  { background: var(--accent); color: #fff; font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: var(--accent-h); }

.btn-ghost {
  background: transparent;
  color:      var(--text2);
  padding:    7px 12px;
  border:     1px solid var(--border);
}
.btn-ghost:hover { color: var(--text); background: var(--surface2); }

.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }

.btn-sm { padding: 6px 12px; font-size: 12px; }

/* ── Inputs ────────────────────────────────────────────────────────────────── */
input[type="text"] {
  font-family:  var(--font);
  font-size:    14px;
  padding:      9px 12px;
  border:       1px solid var(--border);
  border-radius: var(--radius);
  background:   var(--surface);
  color:        var(--text);
  width:        100%;
  outline:      none;
  transition:   border-color .14s;
}
input[type="text"]:focus { border-color: var(--accent); }

/* ── Layout ────────────────────────────────────────────────────────────────── */
#app { min-height: 100vh; display: flex; flex-direction: column; }

.header {
  display:         flex;
  align-items:     center;
  justify-content: space-between;
  padding:         12px 24px;
  background:      var(--surface);
  border-bottom:   1px solid var(--border);
  position:        sticky;
  top:             0;
  z-index:         10;
}
.logo {
  display:     flex;
  align-items: center;
  gap:         8px;
  font-size:   15px;
  font-weight: 700;
  color:       var(--text);
}
.logo-dot { color: var(--accent); font-size: 18px; line-height: 1; }

.header-right { display: flex; align-items: center; gap: 10px; }
.user-chip { font-size: 12px; color: var(--text2); }
.nav-btn { min-width: 40px; justify-content: center; padding: 7px 10px; }
.nav-btn .nav-label { font-size: 16px; line-height: 1; }

/* ── Center screen (login / setup) ─────────────────────────────────────────── */
.center-wrap {
  flex: 1;
  display:         flex;
  align-items:     center;
  justify-content: center;
  padding:         40px 20px;
}
.setup-card {
  background:    var(--surface);
  border:        1px solid var(--border);
  border-radius: 14px;
  padding:       40px 36px;
  width:         100%;
  max-width:     420px;
  box-shadow:    var(--shadow);
}
.setup-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.setup-card .sub { color: var(--text2); font-size: 13px; margin-bottom: 28px; }
.field { margin-bottom: 16px; }
.field label {
  display:        block;
  font-size:      11px;
  font-weight:    700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color:          var(--text2);
  margin-bottom:  6px;
}
.help { font-size: 12px; color: var(--text2); margin-top: 18px; line-height: 1.7; }

/* ── Main app ──────────────────────────────────────────────────────────────── */
.main { flex: 1; max-width: 800px; margin: 0 auto; padding: 28px 24px; width: 100%; }

/* Cards */
.card {
  background:    var(--surface);
  border:        1px solid var(--border);
  border-radius: var(--radius);
  padding:       20px;
  margin-bottom: 14px;
}
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.card-desc  { color: var(--text2); font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.card-head .card-title { margin-bottom: 0; }
.card-count { font-size: 12px; color: var(--text2); font-weight: 600; }

/* Track list */
.track-item {
  display:       flex;
  align-items:   center;
  gap:           10px;
  padding:       10px 0;
  border-bottom: 1px solid var(--border);
}
.track-item:last-child { border-bottom: none; }
.track-num  { font-size: 12px; color: var(--text2); width: 22px; text-align: right; flex-shrink: 0; }
.track-sym  { font-size: 15px; flex-shrink: 0; width: 20px; text-align: center; }
.track-info { flex: 1; min-width: 0; }
.track-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-artist { font-size: 12px; color: var(--text2); }

/* Rows */
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* Settings */
.section-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text2); margin-bottom: 12px;
}
.danger-box { border: 1px solid var(--danger); border-radius: var(--radius); padding: 16px; }

/* Misc */
.sm { font-size: 12px; color: var(--text2); }
.mt8  { margin-top:  8px; }
.mt14 { margin-top: 14px; }
.gap8 { display: flex; gap: 8px; flex-wrap: wrap; }
.genre-pill-row { display: flex; gap: 8px; flex-wrap: wrap; min-height: 32px; margin-bottom: 14px; }
.genre-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: 12px;
  line-height: 1;
}
.genre-pill button {
  border: none;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0;
}
.genre-pill-empty { color: var(--text2); font-size: 12px; align-self: center; }
.gen-progress {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 6px;
}
.gen-progress-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.gen-progress-label {
  font-size: 13px;
  color: var(--text);
}
.gen-progress-pct {
  font-size: 12px;
  color: var(--text2);
  font-weight: 600;
}
.gen-progress-bar {
  width: 100%;
  height: 8px;
  border-radius: 999px;
  background: var(--surface2);
  overflow: hidden;
}
.gen-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, #22c55e 0%, #84cc16 55%, #eab308 100%);
  transition: width .18s ease;
}
.gen-progress-note {
  font-size: 12px;
  color: var(--text2);
}
.gen-actions {
  margin-top: 8px;
}

/* ── Explore tab ───────────────────────────────────────────────────────────── */
/* Genre tag cloud */
.genre-cloud { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; line-height: 1.8; }
.genre-tag {
  cursor:      pointer;
  color:       var(--text);
  opacity:     .8;
  transition:  opacity .12s, color .12s;
  white-space: nowrap;
}
.genre-tag:hover { opacity: 1; color: var(--accent); }
.genre-tag.active { color: var(--accent); font-weight: 700; opacity: 1; }
.genre-tag sup { font-size: .65em; color: var(--text2); margin-left: 1px; }
.genre-tag.active sup { color: var(--accent); opacity: .7; }

/* Artist rows */
.artist-row {
  display:       flex;
  align-items:   flex-start;
  gap:           14px;
  padding:       10px 0;
  border-bottom: 1px solid var(--border);
}
.artist-row:last-child { border-bottom: none; }
.artist-name { font-weight: 600; font-size: 14px; min-width: 170px; flex-shrink: 0; padding-top: 3px; }
.artist-genres { display: flex; flex-wrap: wrap; gap: 4px; }
.a-chip {
  font-size:     11px;
  padding:       2px 9px;
  border-radius: 10px;
  cursor:        pointer;
  white-space:   nowrap;
  transition:    opacity .12s;
}
.a-chip:hover { opacity: .7; }
.artist-row-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
.btn-gen { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); cursor: pointer; white-space: nowrap; transition: background .12s, color .12s; }
.btn-gen:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
/* Mode toggle */
.mode-toggle { display: flex; gap: 2px; background: var(--surface2); border-radius: 8px; padding: 3px; margin-bottom: 14px; width: fit-content; }
.mode-btn { padding: 6px 14px; border-radius: 6px; background: transparent; color: var(--text2); font-size: 13px; font-weight: 500; border: none; cursor: pointer; }
.mode-btn.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }

/* Range slider */
.slider-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.slider-row input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
.slider-val { font-size: 13px; font-weight: 600; color: var(--accent); min-width: 38px; text-align: right; }

/* Settings row for small inputs */
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 12px; }
.setting-row:last-child { border-bottom: none; }
.setting-row label { font-size: 13px; font-weight: 500; }
.setting-row .sub-label { font-size: 12px; color: var(--text2); margin-top: 2px; }
.setting-num {
  width: 96px;
  flex: 0 0 96px;
  text-align: center;
  padding: 6px 8px;
}
.radio-row { display: flex; gap: 16px; }
.radio-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; font-weight: 400; }

/* Energy bar (flow visualisation) */
.track-flow {
  flex-shrink: 0;
  width: 126px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: flex-end;
  text-align: right;
}
.track-flow-line {
  font-size: 11px;
  color: var(--text2);
  line-height: 1.2;
}
.track-energy {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 3px;
  align-items: flex-end;
}
.track-energy-bar {
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--surface2);
  overflow: hidden;
}
.track-energy-fill {
  height: 100%;
  border-radius: 2px;
}
.track-energy-label { font-size: 10px; color: var(--text2); line-height: 1; }

/* Spinner */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display:       inline-block;
  width:         13px; height: 13px;
  border:        2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation:     spin .65s linear infinite;
  vertical-align: middle;
  margin-right:  6px;
}

@media (max-width: 720px) {
  .header {
    padding: 10px 14px;
    gap: 12px;
  }
  .logo {
    gap: 6px;
    font-size: 14px;
    flex: 1;
    min-width: 0;
  }
  .header-right {
    gap: 8px;
    flex-shrink: 0;
  }
  .user-chip {
    display: none;
  }
  .btn-ghost.btn-sm,
  .nav-btn {
    min-width: 38px;
    padding: 7px 9px;
  }
  .main {
    padding: 16px 14px 24px;
  }
  .card {
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-head {
    align-items: flex-start;
  }
  .card-count {
    padding-top: 2px;
  }
  .genre-cloud {
    gap: 8px 12px;
  }
  .artist-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "name action"
      "genres action";
    gap: 8px 12px;
    align-items: center;
  }
  .artist-name {
    grid-area: name;
    min-width: 0;
    padding-top: 0;
  }
  .artist-genres {
    grid-area: genres;
  }
  .artist-row-actions {
    grid-area: action;
    margin-left: 0;
    justify-self: end;
    align-self: center;
  }
  .btn-gen {
    min-width: 36px;
    padding: 5px 10px;
  }
  .track-item {
    align-items: flex-start;
  }
  .track-flow {
    width: 96px;
  }
}
</style>

<div id="app">Loading…</div>

<script>
'use strict';

// ── Constants ─────────────────────────────────────────────────────────────────
const DEFAULT_PLAYLIST_ID = '';
const CLIENT_ID = '6d3ee4dac7564390b28c3e5d85905a44';
const LASTFM_API_KEY = '345277cd160d3b9f859c6d4713b00a8b'; // Replace with your Last.fm API key
const RECCOBEATS_AUDIO_FEATURES_URL = 'https://api.reccobeats.com/v1/audio-features';
const RECCOBEATS_MIN_INTERVAL_MS = 1000;
const RECCOBEATS_BATCH_SIZE = 50;
const SCOPES = [
  'user-library-read',
  'user-follow-read',
  'user-read-private',
  'playlist-modify-public',
  'playlist-modify-private',
].join(' ');

const K = {
  ACCESS_TOKEN   : 'lk_access_token',
  REFRESH_TOKEN  : 'lk_refresh_token',
  TOKEN_EXPIRY   : 'lk_token_expiry',
  VERIFIER       : 'lk_code_verifier',
  ARTIST_MAP     : 'lk_artist_map',
  HISTORY        : 'lk_track_history',
  THEME          : 'lk_theme',
  USER_NAME      : 'lk_user_name',
  PLAYLIST_ID    : 'lk_playlist_id',
  LIKED_TRACKS   : 'lk_liked_tracks',  // cached liked songs from last sync
  // Generation settings
  PL_TRACKS      : 'lk_pl_tracks',    // total tracks, default 20
  KINDRED_PCT    : 'lk_kindred_pct',  // % new-discovery, default 50
  PER_ARTIST     : 'lk_per_artist',   // max tracks per artist, default 2
  HIST_DAYS      : 'lk_hist_days',    // no-repeat window, default 30
  PL_REUSE       : 'lk_pl_reuse',     // 'reuse'|'create', default 'reuse'
  REGION_ONLY    : 'lk_region_only',  // only include region-available tracks
  // Flow & ordering
  FLOW_CURVE     : 'lk_flow_curve',   // 'off'|'smooth'|'arc'|'build'|'descent', default 'arc'
  FLOW_KEY       : 'lk_flow_key',     // 'true'|'false', default 'true'
  FLOW_TEMPO     : 'lk_flow_tempo',   // 'true'|'false', default 'true'
};

// ── App state ─────────────────────────────────────────────────────────────────
let activeTab       = 'main';
let isBusy          = false;
let syncProgress    = null;   // { pct, action, note }
let lastResult      = null;   // last generation result
let genProgress     = null;   // { pct, action, note }
let lastReccoBeatsAt = 0;

// ── Theme ─────────────────────────────────────────────────────────────────────
(function () {
  document.documentElement.dataset.theme = localStorage.getItem(K.THEME) || 'dark';
})();

function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(K.THEME, next);
  render();
}

// ── Storage helpers ───────────────────────────────────────────────────────────
function lsGet(key, fallback = null) {
  try { const v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function lsSet(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function getRedirectUri() {
  return window.location.origin + window.location.pathname;
}
function getPlaylistId() {
  return localStorage.getItem(K.PLAYLIST_ID) || DEFAULT_PLAYLIST_ID;
}

function getGenSettings() {
  return {
    totalTracks : parseInt(localStorage.getItem(K.PL_TRACKS)   || '20'),
    kindredPct  : parseInt(localStorage.getItem(K.KINDRED_PCT) || '50') / 100,
    perArtist   : parseInt(localStorage.getItem(K.PER_ARTIST)  || '2'),
    histDays    : parseInt(localStorage.getItem(K.HIST_DAYS)   || '30'),
    playlistReuse: (localStorage.getItem(K.PL_REUSE) || 'reuse') === 'reuse',
    regionOnly  : localStorage.getItem(K.REGION_ONLY) !== 'false', // default on
  };
}

function getFlowSettings() {
  return {
    curve   : localStorage.getItem(K.FLOW_CURVE)  || 'arc',
    useKey  : localStorage.getItem(K.FLOW_KEY)    !== 'false',
    useTempo: localStorage.getItem(K.FLOW_TEMPO)  !== 'false',
  };
}

// ── PKCE helpers ──────────────────────────────────────────────────────────────
function randString(len) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(len)))
    .map(b => chars[b % chars.length]).join('');
}

async function codeChallenge(verifier) {
  const data   = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// ── Auth ──────────────────────────────────────────────────────────────────────
async function startAuth() {
  const verifier  = randString(64);
  const challenge = await codeChallenge(verifier);
  localStorage.setItem(K.VERIFIER, verifier);

  const p = new URLSearchParams({
    client_id: CLIENT_ID, response_type: 'code',
    redirect_uri: getRedirectUri(),
    code_challenge_method: 'S256', code_challenge: challenge,
    scope: SCOPES,
  });
  window.location = `https://accounts.spotify.com/authorize?${p}`;
}

async function handleCallback(code) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'authorization_code', code,
      redirect_uri: getRedirectUri(),
      client_id: CLIENT_ID,
      code_verifier: localStorage.getItem(K.VERIFIER),
    }),
  });
  const d = await r.json();
  if (!d.access_token) throw new Error('Auth failed: ' + JSON.stringify(d));
  localStorage.setItem(K.ACCESS_TOKEN,  d.access_token);
  localStorage.setItem(K.REFRESH_TOKEN, d.refresh_token);
  localStorage.setItem(K.TOKEN_EXPIRY,  Date.now() + d.expires_in * 1000);
  localStorage.removeItem(K.VERIFIER);
  window.history.replaceState({}, '', window.location.pathname);
}

async function refreshToken() {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'refresh_token',
      refresh_token: localStorage.getItem(K.REFRESH_TOKEN),
      client_id: CLIENT_ID,
    }),
  });
  const d = await r.json();
  if (!d.access_token) throw new Error('Token refresh failed');
  localStorage.setItem(K.ACCESS_TOKEN, d.access_token);
  if (d.refresh_token) localStorage.setItem(K.REFRESH_TOKEN, d.refresh_token);
  localStorage.setItem(K.TOKEN_EXPIRY, Date.now() + d.expires_in * 1000);
  return d.access_token;
}

async function getToken() {
  const exp = parseInt(localStorage.getItem(K.TOKEN_EXPIRY) || '0');
  if (Date.now() > exp - 60_000) return refreshToken();
  return localStorage.getItem(K.ACCESS_TOKEN);
}

function isLoggedIn()  { return !!localStorage.getItem(K.ACCESS_TOKEN); }

function logout() {
  [K.ACCESS_TOKEN, K.REFRESH_TOKEN, K.TOKEN_EXPIRY, K.USER_NAME].forEach(k => localStorage.removeItem(k));
  render();
}

// ── Spotify API ───────────────────────────────────────────────────────────────
async function spotifyFetch(path, opts = {}) {
  const token = await getToken();
  const url   = path.startsWith('http') ? path : `https://api.spotify.com/v1${path}`;
  const res   = await fetch(url, {
    ...opts,
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...opts.headers },
  });
  if (res.status === 429) {
    await sleep(parseInt(res.headers.get('Retry-After') || '2') * 1000);
    return spotifyFetch(path, opts);
  }
  if (res.status === 204) return null;
  if (!res.ok) throw new Error(`Spotify ${res.status}: ${await res.text()}`);
  return res.json();
}

const api = {
  get   : p       => spotifyFetch(p),
  post  : (p, b)  => spotifyFetch(p, { method: 'POST',   body: JSON.stringify(b) }),
  delete: (p, b)  => spotifyFetch(p, { method: 'DELETE', body: JSON.stringify(b) }),
};

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── Last.fm helpers ───────────────────────────────────────────────────────────
const LASTFM_BASE_URL = 'https://ws.audioscrobbler.com/2.0/';

async function lastfmApiCall(method, params) {
  const url = new URL(LASTFM_BASE_URL);
  url.searchParams.set('method', method);
  url.searchParams.set('api_key', LASTFM_API_KEY);
  url.searchParams.set('format', 'json');
  for (const [k, v] of Object.entries(params)) {
    url.searchParams.set(k, v);
  }
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Last.fm API failed: ${res.status}`);
  return await res.json();
}

// Resolves the canonical Last.fm artist name via artist.search.
// Handles transliterated names like "Okean Elzy" → "Океан Ельзи".
async function resolveLastfmArtistName(artistName) {
  try {
    const data = await lastfmApiCall('artist.search', { artist: artistName, limit: 1 });
    const match = data?.results?.artistmatches?.artist?.[0];
    return match?.name || artistName;
  } catch (e) {
    return artistName;
  }
}

async function getGenresFromLastfm(artistName) {
  try {
    const data = await lastfmApiCall('artist.getInfo', { artist: artistName, autocorrect: 1 });
    const tags = data?.artist?.tags?.tag || [];
    if (tags.length) return tags.map(t => t.name.toLowerCase()).filter(Boolean);
    // No tags — artist name may be transliterated; resolve canonical name and retry
    const canonical = await resolveLastfmArtistName(artistName);
    if (canonical === artistName) return [];
    const data2 = await lastfmApiCall('artist.getInfo', { artist: canonical });
    return (data2?.artist?.tags?.tag || []).map(t => t.name.toLowerCase()).filter(Boolean);
  } catch (e) {
    console.warn('Failed to get genres from Last.fm:', e);
    return [];
  }
}

async function getRelatedArtistsFromLastfm(artistName) {
  try {
    const data = await lastfmApiCall('artist.getSimilar', { artist: artistName, autocorrect: 1, limit: 25 });
    const similar = data?.similarartists?.artist || [];
    if (similar.length) return similar.map(a => a.name).filter(Boolean);
    // No results — try resolving canonical name first
    const canonical = await resolveLastfmArtistName(artistName);
    if (canonical === artistName) return [];
    const data2 = await lastfmApiCall('artist.getSimilar', { artist: canonical, limit: 25 });
    return (data2?.similarartists?.artist || []).map(a => a.name).filter(Boolean);
  } catch (e) {
    console.warn('Failed to get related artists from Last.fm:', e);
    return [];
  }
}

// ── History ───────────────────────────────────────────────────────────────────
function loadHistory() {
  const { histDays } = getGenSettings();
  const cutoff = Date.now() - histDays * 86_400_000;
  return (lsGet(K.HISTORY, [])).filter(e => e.usedAt > cutoff);
}

function saveHistory(tracks) {
  const existing = loadHistory();
  const ids      = new Set(existing.map(e => e.id));
  const now      = Date.now();
  for (const t of tracks) {
    if (!ids.has(t.id)) existing.push({ id: t.id, name: t.name, artist: t.artists?.[0]?.name || '', usedAt: now });
  }
  lsSet(K.HISTORY, existing);
}

// ── Library sync ──────────────────────────────────────────────────────────────
async function syncLibrary(log, progress = () => {}) {
  log('Starting library sync …', 'info');
  progress(2, 'Taking a quick inventory of your library.', 'Starting with your liked songs.');

  // Step 1 — page liked songs: collect artist IDs + cache track objects
  const artistIds  = new Set();
  const likedTracks = []; // { id, name, artists: [{id, name}] }
  let offset = 0, total = 1;
  let likedRequests = 0;
  while (offset < total) {
    const page = await api.get(`/me/tracks?limit=50&offset=${offset}`);
    likedRequests++;
    total = page.total;
    for (const item of page.items) {
      const t = item.track;
      if (!t?.id) continue;
      for (const a of (t.artists || [])) if (a.id) artistIds.add(a.id);
      likedTracks.push({ id: t.id, name: t.name, artists: (t.artists || []).map(a => ({ id: a.id, name: a.name })) });
    }
    offset += page.items.length;
    const likedReqTotal = Math.max(1, Math.ceil(total / 50));
    const likedPct = 2 + Math.round(((Math.min(offset, total) + likedRequests) / Math.max(1, total + likedReqTotal)) * 33);
    progress(Math.min(35, likedPct), 'Taking a quick inventory of your library.', `Seen ${Math.min(offset, total)} of ${total} liked songs across ${likedRequests} request${likedRequests === 1 ? '' : 's'}.`);
    log(`  Liked songs: ${Math.min(offset, total)} / ${total}`, 'dim');
    await sleep(80);
  }
  lsSet(K.LIKED_TRACKS, likedTracks);
  log(`Found ${artistIds.size} unique artists in ${likedTracks.length} liked songs`, 'info');

  // Step 2 — batch-fetch full artist objects (need genres)
  const artists = {};
  const idList  = [...artistIds];
  let artistDetailsDone = 0;
  let artistBatchRequests = 0;
  for (let i = 0; i < idList.length; i += 50) {
    const result = await api.get(`/artists?ids=${idList.slice(i, i + 50).join(',')}`);
    artistBatchRequests++;
    for (const a of (result.artists || []))
      if (a) {
        const genres = await getGenresFromLastfm(a.name);
        await sleep(250);
        artists[a.id] = { id: a.id, name: a.name, genres, source: 'liked' };
        artistDetailsDone++;
        const detailReqTotal = Math.max(1, Math.ceil(idList.length / 50));
        const artistPct = 35 + Math.round(((artistDetailsDone + artistBatchRequests) / Math.max(1, idList.length + detailReqTotal)) * 45);
        progress(Math.min(80, artistPct), 'Matching artists to their genres.', `Tagged ${artistDetailsDone} of ${idList.length} artists so far.`);
      }
    log(`  Artist details: ${Math.min(i + 50, idList.length)} / ${idList.length}`, 'dim');
    await sleep(80);
  }

  // Step 3 — followed artists (already include genres)
  let after = undefined, followCount = 0;
  let followRequests = 0;
  while (true) {
    const url  = `/me/following?type=artist&limit=50${after ? '&after=' + after : ''}`;
    const page = await api.get(url);
    followRequests++;
    const items = page.artists?.items || [];
    if (!items.length) break;
    for (const a of items) {
      const genres = await getGenresFromLastfm(a.name);
      await sleep(250);
      if (artists[a.id]) {
        artists[a.id].source = 'both';
        if (!artists[a.id].genres.length) artists[a.id].genres = genres;
      } else {
        artists[a.id] = { id: a.id, name: a.name, genres, source: 'followed' };
      }
    }
    followCount += items.length;
    const followUnits = followCount + followRequests * 5;
    const followPct = 80 + Math.round(15 * (followUnits / Math.max(50, followUnits + 10)));
    progress(Math.min(95, followPct), 'Checking your followed artists too.', `Looked through ${followCount} followed artists over ${followRequests} request${followRequests === 1 ? '' : 's'}.`);
    log(`  Followed artists: ${followCount}`, 'dim');
    after = page.artists?.cursors?.after;
    if (!after) break;
    await sleep(80);
  }

  // Step 4 — build genre index
  progress(97, 'Tying the map together.', 'Grouping artists under the genres they belong to.');
  const genreIndex = {};
  for (const a of Object.values(artists))
    for (const g of a.genres) {
      if (!genreIndex[g]) genreIndex[g] = [];
      genreIndex[g].push(a.id);
    }

  lsSet(K.ARTIST_MAP, { artists, genreIndex, lastSync: new Date().toISOString() });
  log(`✓ ${Object.keys(artists).length} artists · ${Object.keys(genreIndex).length} genres saved`, 'success');
  progress(100, 'Library sync is done.', `Saved ${Object.keys(artists).length} artists across ${Object.keys(genreIndex).length} genres.`);
  return { artists, genreIndex };
}

// ── Flow engine ───────────────────────────────────────────────────────────────

// Camelot Wheel: CAMELOT[key][mode] → { num: 1-12, l: 'A'|'B' }
// ReccoBeats key: 0=C 1=C# 2=D 3=D# 4=E 5=F 6=F# 7=G 8=G# 9=A 10=A# 11=B
// mode: 0=minor(A)  1=major(B)
const CAMELOT = [
  [{num:5,l:'A'},{num:8,l:'B'}],   // C
  [{num:12,l:'A'},{num:3,l:'B'}],  // C#/Db
  [{num:7,l:'A'},{num:10,l:'B'}],  // D
  [{num:2,l:'A'},{num:5,l:'B'}],   // D#/Eb
  [{num:9,l:'A'},{num:12,l:'B'}],  // E
  [{num:4,l:'A'},{num:7,l:'B'}],   // F
  [{num:11,l:'A'},{num:2,l:'B'}],  // F#/Gb
  [{num:6,l:'A'},{num:9,l:'B'}],   // G
  [{num:1,l:'A'},{num:4,l:'B'}],   // G#/Ab
  [{num:8,l:'A'},{num:11,l:'B'}],  // A
  [{num:3,l:'A'},{num:6,l:'B'}],   // A#/Bb
  [{num:10,l:'A'},{num:1,l:'B'}],  // B
];
const PITCH_CLASSES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

function camelotLabel(f) {
  if (!f || f.key < 0 || f.key > 11 || (f.mode !== 0 && f.mode !== 1)) return null;
  const slot = CAMELOT[f.key]?.[f.mode];
  return slot ? `${slot.num}${slot.l}` : null;
}

function musicalKeyLabel(f) {
  if (!f || f.key < 0 || f.key > 11) return null;
  return `${PITCH_CLASSES[f.key]} ${f.mode === 0 ? 'minor' : 'major'}`;
}

function camelotDistance(fa, fb) {
  // Returns 0 (compatible), 0.15 (adjacent), or 0.35 (clash)
  if (fa.key < 0 || fb.key < 0) return 0; // unknown key → no penalty
  const a = CAMELOT[fa.key][fa.mode];
  const b = CAMELOT[fb.key][fb.mode];
  if (a.num === b.num) return 0;           // same num, same or parallel → perfect
  const diff = Math.min(Math.abs(a.num - b.num), 12 - Math.abs(a.num - b.num));
  if (diff === 1) return 0.15;             // adjacent on wheel → good
  if (diff === 2) return 0.25;
  return 0.35;                             // everything else → penalise
}

async function fetchAudioFeatures(ids, onBatch = null) {
  const featureMap = {};
  function extractSpotifyTrackId(href) {
    const match = typeof href === 'string' ? href.match(/\/track\/([A-Za-z0-9]+)(?:\?|$)/) : null;
    return match ? match[1] : null;
  }

  async function fetchReccoBeatsBatch(chunk, attempt = 0) {
    const wait = RECCOBEATS_MIN_INTERVAL_MS - (Date.now() - lastReccoBeatsAt);
    if (wait > 0) await sleep(wait);
    lastReccoBeatsAt = Date.now();

    const res = await fetch(`${RECCOBEATS_AUDIO_FEATURES_URL}?ids=${encodeURIComponent(chunk.join(','))}`);
    if ((res.status === 429 || res.status === 503) && attempt < 4) {
      const retryAfter = parseFloat(res.headers.get('Retry-After') || '0');
      const backoffMs = retryAfter > 0 ? Math.ceil(retryAfter * 1000) : Math.min(8000, 1000 * Math.pow(2, attempt));
      await sleep(Math.max(RECCOBEATS_MIN_INTERVAL_MS, backoffMs));
      return fetchReccoBeatsBatch(chunk, attempt + 1);
    }
    if (!res.ok) throw new Error(`ReccoBeats ${res.status}: ${await res.text()}`);
    return res.json();
  }

  const totalBatches = Math.max(1, Math.ceil(ids.length / RECCOBEATS_BATCH_SIZE));
  for (let i = 0; i < ids.length; i += RECCOBEATS_BATCH_SIZE) {
    const chunk = ids.slice(i, i + RECCOBEATS_BATCH_SIZE);
    try {
      const res = await fetchReccoBeatsBatch(chunk);
      for (const item of (res.content || [])) {
        const spotifyId = extractSpotifyTrackId(item?.href);
        if (!spotifyId) continue;
        featureMap[spotifyId] = {
          id: spotifyId,
          energy: Number.isFinite(Number(item.energy)) ? Number(item.energy) : 0.5,
          valence: Number.isFinite(Number(item.valence)) ? Number(item.valence) : 0.5,
          tempo: Number.isFinite(Number(item.tempo)) ? Number(item.tempo) : 120,
          key: Number.isInteger(item.key) ? item.key : (Number.isInteger(Number(item.key)) ? Number(item.key) : -1),
          mode: Number.isInteger(item.mode) ? item.mode : (Number.isInteger(Number(item.mode)) ? Number(item.mode) : 1),
        };
      }
    } catch (e) {
      console.warn('ReccoBeats audio-features fetch failed:', e.message);
    }
    if (onBatch) onBatch(Math.floor(i / RECCOBEATS_BATCH_SIZE) + 1, totalBatches);
  }

  return featureMap;
}

// Returns an array of n target energy values for the chosen curve shape.
// Returns null entries for 'smooth' (no energy constraint, pure transition scoring).
function getEnergyTargets(n, curve) {
  return Array.from({ length: n }, (_, i) => {
    const t = n > 1 ? i / (n - 1) : 0;
    if (curve === 'arc') {
      const peak = 0.62;
      return t <= peak
        ? 0.38 + (0.86 - 0.38) * (t / peak)
        : 0.86 - (0.86 - 0.42) * ((t - peak) / (1 - peak));
    }
    if (curve === 'build')   return 0.30 + 0.62 * t;
    if (curve === 'descent') return 0.88 - 0.54 * t;
    return null; // 'smooth' or 'off' — no energy constraint
  });
}

// Greedy nearest-neighbour ordering.
// At each position, picks the unplaced track with the lowest combined score of:
//   • how well its energy fits the target arc
//   • how smoothly it transitions from the previous track (ΔE, Δvalence, ΔBPM, key compat)
function orderByFlow(tracks, featureMap, flowSettings) {
  const { curve, useKey, useTempo } = flowSettings;
  const n = tracks.length;
  if (n <= 1) return tracks;

  const neutral = { energy: 0.5, valence: 0.5, tempo: 120, key: -1, mode: 1 };
  const withF = tracks.map(t => ({ ...t, _f: featureMap[t.id] || neutral }));
  const targets = getEnergyTargets(n, curve);
  const remaining = new Set(withF.map((_, i) => i));
  const result = [];

  // Opener: track whose energy is closest to targets[0] (or median for smooth)
  const t0 = targets[0];
  const startIdx = [...remaining].reduce((best, i) => {
    const dBest = t0 !== null ? Math.abs(withF[best]._f.energy - t0) : Math.abs(withF[best]._f.energy - 0.5);
    const dCurr = t0 !== null ? Math.abs(withF[i]._f.energy    - t0) : Math.abs(withF[i]._f.energy    - 0.5);
    return dCurr < dBest ? i : best;
  }, [...remaining][0]);

  result.push(withF[startIdx]);
  remaining.delete(startIdx);

  for (let pos = 1; pos < n; pos++) {
    const prev   = result[pos - 1]._f;
    const target = targets[pos];

    let bestIdx = null, bestScore = Infinity;
    for (const i of remaining) {
      const f = withF[i]._f;

      const energyFit    = target !== null ? Math.abs(f.energy  - target) : 0;
      const deltaEnergy  = Math.abs(f.energy  - prev.energy);
      const deltaValence = Math.abs(f.valence  - prev.valence);
      const deltaTempo   = useTempo ? Math.abs(f.tempo - prev.tempo) / 80 : 0; // 80 BPM diff → 1.0
      const keyPenalty   = useKey   ? camelotDistance(prev, f) : 0;

      const transScore = deltaEnergy * 0.45 + deltaValence * 0.30 + deltaTempo * 0.15 + keyPenalty * 0.40;
      const score      = curve !== 'smooth' ? energyFit * 1.0 + transScore * 0.45 : transScore;

      if (score < bestScore) { bestScore = score; bestIdx = i; }
    }

    result.push(withF[bestIdx]);
    remaining.delete(bestIdx);
  }

  return result;
}

// ── Playlist generation ───────────────────────────────────────────────────────
function pickGenre(genreIndex) {
  const genres  = Object.keys(genreIndex);
  const weights = genres.map(g => genreIndex[g].length);
  let   rand    = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < genres.length; i++) { rand -= weights[i]; if (rand <= 0) return genres[i]; }
  return genres[genres.length - 1];
}

function getLikedForGenre(genreArtistIds, historySet, targetLiked, perArtist, activeGenres = null, genreIndex = null, initialCounts = null) {
  const cache = lsGet(K.LIKED_TRACKS, []);

  // Pre-filter: not in history, at least one artist in the genre pool
  // Shuffle first so results aren't always biased toward most recently liked songs
  let candidates = shuffleArray([...cache]).filter(t =>
    t?.id && !historySet.has(t.id) &&
    t.artists.some(a => genreArtistIds.has(a.id))
  );

  // When multiple genres are active, score each track by how many of those genres
  // its best-matching artist covers. Reject tracks below 50% match, sort the rest high-to-low.
  if (activeGenres && activeGenres.length > 1 && genreIndex) {
    const artistGenreCount = new Map();
    for (const g of activeGenres)
      for (const aid of (genreIndex[g] || []))
        artistGenreCount.set(aid, (artistGenreCount.get(aid) || 0) + 1);

    const threshold = activeGenres.length * 0.5;
    candidates = candidates.filter(t =>
      Math.max(0, ...t.artists.map(ar => artistGenreCount.get(ar.id) || 0)) > threshold
    );
    candidates.sort((a, b) => {
      const scoreA = Math.max(0, ...a.artists.map(ar => artistGenreCount.get(ar.id) || 0));
      const scoreB = Math.max(0, ...b.artists.map(ar => artistGenreCount.get(ar.id) || 0));
      return scoreB - scoreA;
    });
  }

  // Pick top N respecting the perArtist cap.
  // initialCounts lets callers carry over counts from a previous pass.
  const matched      = [];
  const artistCounts = new Map(initialCounts || []);
  for (const t of candidates) {
    if (matched.length >= targetLiked) break;
    const ans = t.artists.map(a => a.name.toLowerCase());
    if (ans.some(n => (artistCounts.get(n) || 0) >= perArtist)) continue;
    matched.push(t);
    ans.forEach(n => artistCounts.set(n, (artistCounts.get(n) || 0) + 1));
  }
  return { matched, artistCounts };
}

async function findNewTrack(seed, libNames, historySet, usedIds, log, regionOnly) {
  const seedArtistName = seed.artists[0]?.name;
  const seedArtistId = seed.artists[0]?.id;
  if (!seedArtistName || !seedArtistId) return null;

  // Strategy A: related artists from Last.fm → top tracks
  try {
    const relatedNames = await getRelatedArtistsFromLastfm(seedArtistName);
    const shuffled = relatedNames.filter(n => !libNames.has(n.toLowerCase()))
      .sort(() => Math.random() - .5);
    for (const relName of shuffled) {
      const searchRes = await api.get(`/search?q=${encodeURIComponent(`artist:"${relName}"`)}&type=artist&limit=1`);
      const artists = searchRes.artists?.items || [];
      if (!artists.length) continue;
      const rel = artists[0];
      const tops = (await api.get(`/artists/${rel.id}/top-tracks?market=from_token`)).tracks || [];
      await sleep(60);
      for (const t of tops) {
        if (!t?.id || historySet.has(t.id) || usedIds.has(t.id)) continue;
        if (t.artists.some(a => libNames.has(a.name.toLowerCase()))) continue;
        return t;
      }
    }
  } catch (e) { log(`  related-artist lookup failed: ${e.message}`, 'warn'); }

  // Strategy B: genre keyword search using Last.fm genres
  try {
    const genres = await getGenresFromLastfm(seedArtistName);
    const genre  = genres[0];
    const q      = genre ? encodeURIComponent(`genre:"${genre}"`) : encodeURIComponent(seed.name);
    const res    = await api.get(`/search?q=${q}&type=track&limit=50${regionOnly ? '&market=from_token' : ''}`);
    const tracks = (res.tracks?.items || []).sort(() => Math.random() - .5);
    for (const t of tracks) {
      if (!t?.id || historySet.has(t.id) || usedIds.has(t.id)) continue;
      if (t.artists.some(a => libNames.has(a.name.toLowerCase()))) continue;
      return t;
    }
  } catch (e) { log(`  genre search failed: ${e.message}`, 'warn'); }

  return null;
}

async function clearPlaylist(playlistId) {
  const ids = [];
  let url = `/playlists/${playlistId}/tracks?fields=items(track(id)),next,total&limit=100`;
  while (url) {
    const page = await api.get(url);
    for (const item of (page.items || []))
      if (item.track?.id) ids.push(item.track.id);
    url = page.next || null;
    await sleep(100);
  }
  for (let i = 0; i < ids.length; i += 100) {
    await api.delete(`/playlists/${playlistId}/tracks`,
      { tracks: ids.slice(i, i + 100).map(id => ({ uri: `spotify:track:${id}` })) });
    await sleep(200);
  }
  return ids.length;
}

async function generatePlaylist(log, opts = {}, progress = () => {}) {
  const mapData = lsGet(K.ARTIST_MAP);
  if (!mapData) throw new Error('No artist data — run "Sync Library" first.');
  if (!lsGet(K.LIKED_TRACKS, []).length) throw new Error('No liked songs cached — run "Sync Library" first.');

  const { artists, genreIndex } = mapData;
  const { totalTracks, kindredPct, perArtist, playlistReuse, regionOnly } = getGenSettings();
  const flow = getFlowSettings();
  const targetNew   = Math.round(totalTracks * kindredPct);
  const targetLiked = totalTracks - targetNew;
  const featureBatches = flow.curve === 'off' ? 0 : Math.max(1, Math.ceil(totalTracks / RECCOBEATS_BATCH_SIZE));
  const progressTotal = Math.max(1, totalTracks + featureBatches + 4);
  const clampProgress = (value) => Math.max(2, Math.min(99, Math.round((value / progressTotal) * 100)));
  const trackProgress = (tracksDone, action, note = '') => progress(clampProgress(Math.min(totalTracks, tracksDone)), action, note);
  const requestProgress = (requestUnits, action, note = '') => progress(clampProgress(totalTracks + requestUnits), action, note);

  // Genre selection
  const genre = opts.genre || pickGenre(genreIndex);
  const label = opts.label && opts.label !== genre ? `${opts.label} → ${genre}` : genre;
  progress(2, 'Getting the shape of this playlist together.', opts.seedArtistName ? `Starting from ${opts.seedArtistName} and the genres around them.` : `Starting from ${label}.`);
  log(`🎵 Genre: ${label}`, 'info');
  log(`📐 ${targetLiked} liked + ${targetNew} new = ${totalTracks} tracks · max ${perArtist}/artist`, 'dim');

  const history    = loadHistory();
  const historySet = new Set(history.map(e => e.id));
  log(`📋 Excluding ${historySet.size} recently used tracks`, 'dim');

  const activeGenres   = opts.genres?.length ? opts.genres : [genre];
  const genreArtistIds = new Set(activeGenres.flatMap(g => genreIndex[g] || []));
  const genreLabel     = activeGenres.length > 1 ? `${activeGenres.length} genres` : genre;
  log(`👥 ${genreArtistIds.size} library artists across ${genreLabel}`, 'dim');
  const libNames = new Set(Object.values(artists).map(a => a.name.toLowerCase()));

  // Liked songs
  // When generating for a specific artist, prioritise their own liked tracks first,
  // then fill remaining slots from the broader genre pool.
  trackProgress(0, 'Pulling together the tracks you already know.', opts.seedArtistName ? `Looking first for liked songs by ${opts.seedArtistName}.` : `Looking for about ${targetLiked} liked tracks.`);
  log(`🔍 Scanning for ${targetLiked} liked songs …`, 'info');
  let liked = [];
  if (opts.seedArtistName) {
    const seedLower = opts.seedArtistName.toLowerCase();
    const seedArtistObj = Object.values(artists).find(a => a.name.toLowerCase() === seedLower);
    if (seedArtistObj) {
      const seedIdSet = new Set([seedArtistObj.id]);
      const { matched: fromSeed, artistCounts: seedCounts } = getLikedForGenre(seedIdSet, historySet, targetLiked, perArtist);
      liked = fromSeed;
      if (fromSeed.length < targetLiked) {
        // Fill remaining from genre pool, passing seed counts so the cap carries over
        const usedLikedIds = new Set(fromSeed.map(t => t.id));
        const historyPlusSeed = new Set([...historySet, ...usedLikedIds]);
        const { matched: rest } = getLikedForGenre(genreArtistIds, historyPlusSeed, targetLiked - fromSeed.length, perArtist, activeGenres, genreIndex, seedCounts);
        liked = [...fromSeed, ...rest];
      }
    } else {
      const { matched } = getLikedForGenre(genreArtistIds, historySet, targetLiked, perArtist, activeGenres, genreIndex);
      liked = matched;
    }
  } else {
    const { matched } = getLikedForGenre(genreArtistIds, historySet, targetLiked, perArtist, activeGenres, genreIndex);
    liked = matched;
  }

  if (!liked.length) {
    log(`⚠ No liked songs available — filling entirely with new discoveries`, 'warn');
  } else {
    log(`Found ${liked.length} liked track(s)`, 'success');
    for (const t of liked) log(`  ♥  ${t.artists[0].name} — ${t.name}`, 'dim');
  }
  trackProgress(targetLiked, 'Liked tracks are in place.', liked.length ? `${liked.length} landed from your library.` : 'No good library matches, so this one will lean on discovery.');

  // Recalculate targetNew to fill any shortfall in liked tracks
  const adjustedTargetNew = totalTracks - liked.length;
  if (adjustedTargetNew !== targetNew) {
    log(`  Adjusting new discoveries: ${targetNew} → ${adjustedTargetNew} to fill ${totalTracks} total`, 'dim');
  }

  // New discoveries — cycle through seeds round-robin until adjustedTargetNew is met
  trackProgress(targetLiked, 'Wandering a little wider for new matches.', adjustedTargetNew ? `Looking for ${adjustedTargetNew} new tracks that still fit.` : 'No extra discovery needed for this one.');
  log(`🔎 Finding ${adjustedTargetNew} new discoveries …`, 'info');
  const usedIds  = new Set([...historySet, ...liked.map(t => t.id)]);
  const newTracks = [];

  // When generating for a specific artist, seed discoveries exclusively from that artist
  // so that Last.fm similarity radiates from them, not from unrelated genre pool tracks.
  const discoverySeeds = await (async () => {
    const seedArtistLower = opts.seedArtistName?.toLowerCase();

    if (seedArtistLower) {
      // Preferred: liked tracks by the seed artist
      const fromLiked = liked.filter(t => t.artists.some(a => a.name.toLowerCase() === seedArtistLower));
      if (fromLiked.length) return fromLiked;

      // Fallback: top tracks of the seed artist from Spotify
      log(`  No liked tracks for ${opts.seedArtistName} — fetching their top tracks as seeds`, 'dim');
      const artistObj = Object.values(artists).find(a => a.name.toLowerCase() === seedArtistLower);
      if (artistObj) {
        try {
          const tops = (await api.get(`/artists/${artistObj.id}/top-tracks?market=from_token`)).tracks || [];
          const seeds = [];
          for (const t of tops) {
            if (t?.id && !historySet.has(t.id) && !usedIds.has(t.id)) {
              seeds.push(t);
              usedIds.add(t.id);
            }
          }
          if (seeds.length) return seeds;
        } catch (_) {}
      }
    }

    // No specific artist — seed from liked tracks, or fall back to genre artist top tracks
    if (liked.length > 0) return liked;
    const seeds = [];
    for (const aid of [...genreArtistIds].slice(0, 5)) {
      try {
        const tops = (await api.get(`/artists/${aid}/top-tracks?market=from_token`)).tracks || [];
        const t = tops.find(t => t?.id && !historySet.has(t.id) && !usedIds.has(t.id));
        if (t) { seeds.push(t); usedIds.add(t.id); }
      } catch (_) {}
      await sleep(80);
    }
    return seeds;
  })();
  if (!discoverySeeds.length) throw new Error('No tracks found for this genre. Try syncing your library or picking a different genre.');
  // Cap attempts to avoid infinite loops when a genre is very sparse
  const maxAttempts = adjustedTargetNew * 4;
  let seedIdx = 0, attempts = 0, consecutiveMisses = 0;
  while (newTracks.length < adjustedTargetNew && attempts < maxAttempts && consecutiveMisses < discoverySeeds.length * 2) {
    const seed = discoverySeeds[seedIdx % discoverySeeds.length];
    seedIdx++;
    attempts++;
    const t = await findNewTrack(seed, libNames, historySet, usedIds, log, regionOnly);
    if (t) {
      newTracks.push(t);
      usedIds.add(t.id);
      consecutiveMisses = 0;
      log(`  ✨ ${t.artists[0].name} — ${t.name}`, 'dim');
      trackProgress(targetLiked + newTracks.length, 'Wandering a little wider for new matches.', `Found ${newTracks.length} of ${adjustedTargetNew} new tracks so far.`);
    } else {
      consecutiveMisses++;
      if (seedIdx % liked.length === 0)
        log(`  ⚠ No match for: ${seed.artists[0].name} — ${seed.name}`, 'warn');
    }
    await sleep(120);
  }

  // Combine all tracks into one pool — flow ordering will arrange them
  let playlist = [
    ...liked.map(t => ({ ...t, _type: 'liked' })),
    ...newTracks.map(t => ({ ...t, _type: 'new' })),
  ];
  if (!playlist.length) throw new Error('Could not find any tracks for this genre. Try a different genre or shorten your no-repeat window.');

  // Flow ordering
  let featureMap = {};
  if (flow.curve === 'off') {
    shuffleArray(playlist);
    requestProgress(1, 'Keeping the order loose and simple.', 'Energy curve is off, so the playlist stays in a natural shuffled order.');
  } else {
    requestProgress(0, 'Checking tempo, key, and energy so the order feels natural.', `Fetching flow data for ${playlist.length} tracks.`);
    log(`🌊 Fetching audio features from ReccoBeats for flow ordering …`, 'info');
    featureMap = await fetchAudioFeatures(playlist.map(t => t.id), (done, total) => {
      requestProgress(done, 'Checking tempo, key, and energy so the order feels natural.', `Flow request ${done} of ${total}.`);
    });
    const fetched = Object.keys(featureMap).length;
    log(`  Got features for ${fetched} / ${playlist.length} tracks`, 'dim');
    if (fetched > 0) {
      requestProgress(featureBatches + 1, 'Putting the tracks into a smoother sequence.', `Flow data came back for ${fetched} of ${playlist.length} tracks.`);
      playlist = orderByFlow(playlist, featureMap, flow);
      log(`  Ordered with curve: ${flow.curve}${flow.useKey ? ' · key compat' : ''}${flow.useTempo ? ' · tempo' : ''}`, 'dim');
    } else {
      requestProgress(featureBatches + 1, 'Keeping the order loose and simple.', 'No flow data came back, so I left the order relaxed.');
      shuffleArray(playlist);
    }
  }

  // Create a new playlist or clear and reuse the existing one
  let pid = getPlaylistId();
  const shouldReuse = pid && playlistReuse;
  if (shouldReuse) {
    requestProgress(featureBatches + 2, 'Tidying up your existing playlist.', 'Clearing out the previous tracks first.');
    log('🗑  Clearing existing playlist …', 'info');
    const removed = await clearPlaylist(pid);
    log(`  Removed ${removed} old tracks`, 'dim');
  } else {
    requestProgress(featureBatches + 2, 'Setting up a fresh playlist on Spotify.', 'Creating a new home for this batch.');
    log('📋 Creating new playlist …', 'info');
    const me   = await api.get('/me');
    const date = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const newPl = await api.post(`/users/${me.id}/playlists`, {
      name: `Liked & Kindred — ${genre} (${date})`,
      public: false,
      description: `Auto-generated · ${genre} · ${new Date().toLocaleDateString()}`,
    });
    pid = newPl.id;
    log(`  Created "${newPl.name}"`, 'dim');
  }

  requestProgress(featureBatches + 3, 'Sending the finished set over to Spotify.', `Uploading ${playlist.length} tracks now.`);
  await api.post(`/playlists/${pid}/tracks`, { uris: playlist.map(t => `spotify:track:${t.id}`) });
  log(`✅ Added ${playlist.length} tracks`, 'success');

  saveHistory(playlist);
  log('💾 History saved', 'dim');

  requestProgress(featureBatches + 4, 'Giving it one last look.', 'Making sure everything landed where it should.');
  const check = await api.get(`/playlists/${pid}?fields=tracks(total),name`);
  log(`✓ "${check.name}" — ${check.tracks.total} tracks on Spotify`, 'success');
  progress(100, 'Playlist is ready.', `"${check.name}" now has ${check.tracks.total} tracks.`);

  return { genre, label, playlist, playlistId: pid, featureMap };
}

// ── DOM helpers ───────────────────────────────────────────────────────────────
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null) continue;
    if (k === 'class')    { e.className = v; }
    else if (k === 'disabled') { e.disabled = !!v; }
    else if (k.startsWith('on')) { e.addEventListener(k.slice(2).toLowerCase(), v); }
    else { e.setAttribute(k, v); }
  }
  for (const kid of kids) {
    if (kid == null) continue;
    e.append(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  }
  return e;
}

function updateGenerationProgressUI() {
  const pctEl = document.getElementById('gen-progress-pct');
  const labelEl = document.getElementById('gen-progress-label');
  const noteEl = document.getElementById('gen-progress-note');
  const fillEl = document.getElementById('gen-progress-fill');
  if (!pctEl || !labelEl || !noteEl || !fillEl || !genProgress) return;
  pctEl.textContent = `${genProgress.pct}%`;
  labelEl.textContent = genProgress.action;
  noteEl.textContent = genProgress.note || '';
  fillEl.style.width = `${genProgress.pct}%`;
}

function setGenerationProgress(pct, action, note = '') {
  genProgress = {
    pct: Math.max(0, Math.min(100, Math.round(pct))),
    action,
    note,
  };
  updateGenerationProgressUI();
}

function updateSyncProgressUI() {
  const pctEl = document.getElementById('sync-progress-pct');
  const labelEl = document.getElementById('sync-progress-label');
  const noteEl = document.getElementById('sync-progress-note');
  const fillEl = document.getElementById('sync-progress-fill');

  labelEl.textContent = syncProgress.action;
  noteEl.textContent = syncProgress.note || '';
  fillEl.style.width = `${syncProgress.pct}%`;
}

function setSyncProgress(pct, action, note = '') {
  syncProgress = {
    pct: Math.max(0, Math.min(100, Math.round(pct))),
    action,
    note,
  };
  updateSyncProgressUI();
}

function renderLibrarySyncCard() {
  const mapData    = lsGet(K.ARTIST_MAP);

function startGenerate(opts = {}) {
  const mapData = lsGet(K.ARTIST_MAP);
  if (isBusy || !mapData) return;
  isBusy = true; lastResult = null;
  setGenerationProgress(2, 'Getting the shape of this playlist together.', 'Just a moment while I line things up.');
  render();
  generatePlaylist(() => {}, opts, setGenerationProgress)
    .then(r  => { lastResult = r; })
    .catch(e => {
      alert('Playlist generation failed: ' + e.message);

    .finally(() => {
      isBusy = false;
      genProgress = null;
      render();
    });
}

    el('p', { class: 'section-label', style: 'margin-top:20px' }, 'Flow & Ordering'),

    el('div', { class: 'setting-row', style: 'display:block;padding:12px 0' },
      el('div', {},
        el('label', {}, 'Energy curve'),
        el('div', { class: 'sub-label' }, 'Shape of the energy arc across the playlist'),
      ),
      el('div', { class: 'mode-toggle', style: 'margin-top:8px;margin-bottom:0' },
        ...['off','smooth','arc','build','descent'].map(val => {
          const labels = { off:'Off', smooth:'Smooth', arc:'Arc ↑↓', build:'Build ↑', descent:'Descend ↓' };
          const btn = el('button', { class: `mode-btn${(localStorage.getItem(K.FLOW_CURVE)||'arc')===val?' active':''}` }, labels[val]);
          btn.addEventListener('click', () => {
            btn.closest('.mode-toggle').querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            localStorage.setItem(K.FLOW_CURVE, val);
          });
          return btn;
        })
      ),
      el('div', { class: 'sm', style: 'margin-top:6px;color:var(--text2)' },
        'Off = random order · Smooth = minimize transitions · Arc/Build/Descent = energy curve shapes'
      ),
    ),

    el('div', { class: 'setting-row' },
      el('div', {},
        el('label', {}, 'Key compatibility (Camelot Wheel)'),
        el('div', { class: 'sub-label' }, 'Prefer tracks in harmonically compatible keys'),
      ),
      (() => {
        const chk = el('input', { type: 'checkbox' });
        chk.checked = localStorage.getItem(K.FLOW_KEY) !== 'false';
        chk.addEventListener('change', () => localStorage.setItem(K.FLOW_KEY, chk.checked));
        return el('label', {}, chk, ' Enable');
      })(),
    ),

    el('div', { class: 'setting-row' },
      el('div', {},
        el('label', {}, 'Tempo similarity'),
        el('div', { class: 'sub-label' }, 'Avoid large BPM jumps between consecutive tracks'),
      ),
      (() => {
        const chk = el('input', { type: 'checkbox' });
        chk.checked = localStorage.getItem(K.FLOW_TEMPO) !== 'false';
        chk.addEventListener('change', () => localStorage.setItem(K.FLOW_TEMPO, chk.checked));
        return el('label', {}, chk, ' Enable');
      })(),
    ),

  );

  const storedDataCard = el('div', { class: 'card' },
    el('p', { class: 'section-label' }, 'Stored Data'),
    el('p', { class: 'sm' },
      mapData
        ? `Artist map: ${Object.keys(mapData.artists).length} artists · ${Object.keys(mapData.genreIndex).length} genres · synced ${new Date(mapData.lastSync).toLocaleString()}`
        : 'Artist map: not synced yet'
    ),
    el('p', { class: 'sm mt8' }, `Track history: ${history.length} entries (${s.histDays}-day window)`),
  );

  const dangerCard = el('div', { class: 'card' },
    el('p', { class: 'section-label' }, 'Danger Zone'),
    el('div', { class: 'danger-box' },
      el('div', { class: 'gap8' },
        el('button', { class: 'btn-danger btn-sm', onClick: () => {
          if (confirm('Clear track history? Deduplication will reset.')) {
            localStorage.removeItem(K.HISTORY); render();
          }
        }}, 'Clear History'),
        el('button', { class: 'btn-danger btn-sm', onClick: () => {
          if (confirm('Clear artist map? You\'ll need to sync again.')) {
            localStorage.removeItem(K.ARTIST_MAP); render();
          }
        }}, 'Clear Artist Map'),
        el('button', { class: 'btn-danger btn-sm', onClick: () => {
          if (confirm('Disconnect your Spotify account?')) logout();
        }}, 'Disconnect'),
      )
    ),
  );

  return el('div', {}, spotifyAppCard, syncCard, generationCard, storedDataCard, dangerCard);
}

// ── Render: explore tab ───────────────────────────────────────────────────────
const HUES = [210, 130, 340, 270, 45, 20, 160, 190, 350, 230, 60, 300];

function chipStyle(genre) {
  let h = 0;
  for (const c of genre) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const hue  = HUES[h % HUES.length];
  const dark = document.documentElement.dataset.theme === 'dark';
  return dark
    ? `background:hsl(${hue},35%,22%);color:hsl(${hue},70%,72%)`
    : `background:hsl(${hue},60%,92%);color:hsl(${hue},70%,28%)`;
}

function renderExploreTab() {
  const mapData = lsGet(K.ARTIST_MAP);
  if (!mapData) {
    return el('div', {},
      renderLibrarySyncCard()
    );
  }

  const history = loadHistory();
  const s = getGenSettings();
  const { artists, genreIndex } = mapData;
  const sortedGenres  = Object.entries(genreIndex).sort((a, b) => b[1].length - a[1].length);
  const sortedArtists = Object.values(artists).sort((a, b) => a.name.localeCompare(b.name));
  const counts        = sortedGenres.map(([, ids]) => ids.length);
  const maxC = counts[0] || 1, minC = counts[counts.length - 1] || 1;

  // Font-size scale for genre cloud (12 px → 34 px)
  function tagSize(n) {
    if (maxC === minC) return 16;
    return Math.round(12 + ((n - minC) / (maxC - minC)) * 22);
  }

  // Mutable filter state — lives inside this function, no full re-render needed
  const selectedGenres = new Set();
  let selectedArtist = null;

  const descParts = [
    `${s.totalTracks} tracks`,
    `${Math.round(s.kindredPct * 100)}% new discoveries`,
    `max ${s.perArtist}/artist`,
    history.length ? `${history.length} in history` : null,
  ].filter(Boolean);

  const cloudEl         = el('div', { class: 'genre-cloud' });
  const artistListEl    = el('div', {});
  const artistCountEl   = el('div', { class: 'card-count' });
  const genreCountEl    = el('div', { class: 'card-count' }, `${sortedGenres.length} genres`);
  const pillRowEl       = el('div', { class: 'genre-pill-row' });
  const generateHintEl  = el('p', { class: 'sm', style: 'margin-bottom:12px' });
  const generateBtn = el('button', {
    class: 'btn-primary',
    disabled: true,
    style: 'white-space:nowrap;flex-shrink:0',
    onClick: () => {
      const genres = [...selectedGenres];
      if (!genres.length || isBusy) return;
      startGenerate({
        genre: genres[0],
        genres,
        label: selectedArtist ? selectedArtist.name : genres.join(' + '),
        seedArtistName: selectedArtist?.name,
      });
    },
  }, isBusy
    ? el('span', {}, el('span', { class: 'spinner' }), 'Generating…')
    : '▶ Generate Playlist'
  );

  // Build genre tag cloud
  const tagEls = {};
  for (const [genre, ids] of sortedGenres) {
    const tag = el('span', {
      class: 'genre-tag',
      style: `font-size:${tagSize(ids.length)}px`,
      'data-g': genre,
    }, genre + '\u202f', el('sup', {}, String(ids.length)));
    tag.addEventListener('click', () => toggleGenre(genre));
    tagEls[genre] = tag;
    cloudEl.append(tag);
  }

  function syncGenreTags() {
    for (const [g, t] of Object.entries(tagEls)) t.classList.toggle('active', selectedGenres.has(g));
  }

  function updateGenerateCard() {
    const genres = [...selectedGenres];
    pillRowEl.innerHTML = '';
    if (selectedArtist) {
      const removeArtistBtn = el('button', { type: 'button', title: `Remove artist seed ${selectedArtist.name}` }, '×');
      removeArtistBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedArtist = null;
        updateGenerateCard();
      });
      pillRowEl.append(el('div', { class: 'genre-pill' }, `Artist: ${selectedArtist.name}`, removeArtistBtn));
    }

    if (!genres.length) {
      pillRowEl.append(el('div', { class: 'genre-pill-empty' }, 'Select one or more genres from the cloud below.'));
      generateHintEl.textContent = selectedArtist
        ? 'Add one or more genres for this artist seed before generating.'
        : 'Selected genres drive both the artist filter and the playlist generation pool.';
      generateBtn.disabled = true;
      return;
    }

    for (const genre of genres) {
      const removeBtn = el('button', { type: 'button', title: `Remove ${genre}` }, '×');
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleGenre(genre);
      });
      pillRowEl.append(el('div', { class: 'genre-pill', style: chipStyle(genre) }, genre, removeBtn));
    }
    generateHintEl.textContent = `${selectedArtist ? `Seeded from ${selectedArtist.name} · ` : ''}${genres.length} selected genre${genres.length === 1 ? '' : 's'} · ${descParts.join(' · ')}`;
    generateBtn.disabled = isBusy || !mapData;
  }

  function toggleGenre(genre) {
    if (selectedGenres.has(genre)) selectedGenres.delete(genre);
    else selectedGenres.add(genre);
    syncGenreTags();
    updateGenerateCard();
    updateList();
  }

  function updateList() {
    const q = searchInp.value.trim().toLowerCase();
    let filtered = sortedArtists;

    if (selectedGenres.size) {
      const required = [...selectedGenres];
      filtered = filtered.filter(a => required.every(g => a.genres.includes(g)));
    }
    if (q) {
      filtered = filtered.filter(a =>
        a.name.toLowerCase().includes(q) ||
        a.genres.some(g => g.toLowerCase().includes(q))
      );
    }

    artistCountEl.textContent = `${filtered.length} artist${filtered.length !== 1 ? 's' : ''}`;
    artistListEl.innerHTML = '';
    for (const a of filtered) {
      const genreEl = el('div', { class: 'artist-genres' },
        ...a.genres.map(g => {
          const chip = el('span', { class: 'a-chip', style: chipStyle(g) }, g);
          chip.addEventListener('click', () => toggleGenre(g));
          return chip;
        })
      );

      // Determine a genre to use when generating for this artist.
      // If the artist has no genre data, fall back to a genre-less artist seed.
      const artistGenres = a.genres.filter(g => genreIndex[g]);
      const artistGenre  = artistGenres[0] || null;
      const genBtn = el('button', { class: 'btn-gen' }, '▶');
      genBtn.title = artistGenre
        ? `Seed from ${a.name} and add ${artistGenres.join(', ')}`
        : `No mapped genres available for ${a.name}`;
      genBtn.style.opacity = artistGenre ? '1' : '0.5';
      genBtn.disabled = !artistGenres.length;
      genBtn.addEventListener('click', () => {
        if (!artistGenres.length) return;
        selectedArtist = { name: a.name };
        for (const genre of artistGenres) selectedGenres.add(genre);
        syncGenreTags();
        updateGenerateCard();
        updateList();
      });

      artistListEl.append(el('div', { class: 'artist-row' },
        el('span', { class: 'artist-name' }, a.name),
        genreEl,
        el('div', { class: 'artist-row-actions' }, genBtn),
      ));
    }
  }

  const searchInp = el('input', { type: 'text', placeholder: 'Filter by artist or genre…' });
  searchInp.addEventListener('input', updateList);

  // Initial render
  updateGenerateCard();
  updateList();

  return el('div', {},
    el('div', { class: 'card' },
      el('div', { class: 'card-head' },
        el('p', { class: 'card-title' }, 'Generate Playlist'),
      ),
      el('p', { class: 'card-desc' },
        'Build a playlist from the genres you select below. The same selection also filters the artist list.'
      ),
      pillRowEl,
      generateHintEl,
      isBusy && genProgress ? el('div', { class: 'gen-progress' },
        el('div', { class: 'gen-progress-head' },
          el('div', { class: 'gen-progress-label', id: 'gen-progress-label' }, genProgress.action),
          el('div', { class: 'gen-progress-pct', id: 'gen-progress-pct' }, `${genProgress.pct}%`),
        ),
        el('div', { class: 'gen-progress-bar' },
          el('div', {
            class: 'gen-progress-fill',
            id: 'gen-progress-fill',
            style: `width:${genProgress.pct}%`,
          }),
        ),
        el('div', { class: 'gen-progress-note', id: 'gen-progress-note' }, genProgress.note || ''),
      ) : null,
      el('div', { class: 'row gen-actions' }, generateBtn),
    ),

    renderGenerationResult(),

    el('div', { class: 'card' },
      el('div', { class: 'card-head' },
        el('p', { class: 'card-title' }, 'Genres'),
        genreCountEl,
      ),
      cloudEl,
    ),

    el('div', { class: 'card', style: 'margin-top:8px' },
      el('div', { class: 'card-head' },
        el('p', { class: 'card-title' }, 'Artists'),
        artistCountEl,
      ),
      searchInp,
      artistListEl,
    ),
  );
}

// ── Render: main app ──────────────────────────────────────────────────────────
function renderApp() {
  if (!['main', 'settings'].includes(activeTab)) activeTab = 'main';
  return el('div', { class: 'main' },
    activeTab === 'settings' ? renderSettingsTab() : renderExploreTab(),
  );
}

// ── Root render ───────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('app');
  root.innerHTML = '';
  root.append(renderHeader());
  root.append(!isLoggedIn() ? renderSetup() : renderApp());
}

// ── Boot ──────────────────────────────────────────────────────────────────────
(async () => {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const error  = params.get('error');

  if (error) {
    alert('Spotify returned an error: ' + error);
    window.history.replaceState({}, '', window.location.pathname);
  } else if (code) {
    try {
      await handleCallback(code);
      try {
        const me = await api.get('/me');
        localStorage.setItem(K.USER_NAME, me.display_name || me.id);
      } catch (_) {}
    } catch (e) {
      alert('Login failed: ' + e.message);
    }
  }

  render();
})();
</script>
